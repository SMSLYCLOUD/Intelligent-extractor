<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Lead Extractor AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#475569',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-primary mb-2">Intelligent Lead Extractor AI</h1>
            <p class="text-slate-500">Advanced Web Discovery & Enrichment System</p>
        </header>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <!-- Navigation Tabs -->
            <div class="flex border-b border-slate-200">
                <button onclick="switchTab('discovery')" class="tab-btn px-6 py-4 font-semibold text-slate-600 hover:text-primary border-b-2 border-transparent hover:border-primary transition-colors active" data-tab="discovery">
                    <i class="fas fa-search mr-2"></i> Web Discovery
                </button>
                <button onclick="switchTab('bulk')" class="tab-btn px-6 py-4 font-semibold text-slate-600 hover:text-primary border-b-2 border-transparent hover:border-primary transition-colors" data-tab="bulk">
                    <i class="fas fa-file-upload mr-2"></i> Bulk Enrichment
                </button>
                <button onclick="switchTab('history')" class="tab-btn px-6 py-4 font-semibold text-slate-600 hover:text-primary border-b-2 border-transparent hover:border-primary transition-colors" data-tab="history">
                    <i class="fas fa-history mr-2"></i> History
                </button>
            </div>

            <div class="p-6">
                <!-- AI Settings (Common) -->
                <div class="mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <h3 class="font-semibold text-slate-700 mb-3"><i class="fas fa-robot mr-2"></i>AI Configuration</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Provider</label>
                            <select id="aiProvider" onchange="toggleKeyInput()" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                                <option value="openai">OpenAI (GPT-3.5)</option>
                                <option value="gemini">Google Gemini</option>
                                <option value="anthropic">Anthropic (Claude)</option>
                                <option value="ollama">Ollama (Local)</option>
                            </select>
                        </div>
                        <div id="apiKeyContainer">
                            <label class="block text-sm font-medium text-slate-600 mb-1">API Key</label>
                            <input type="password" id="apiKey" placeholder="sk-..." class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                            <p class="text-xs text-slate-400 mt-1" id="keyHelp">Leave blank if set in environment variables.</p>
                        </div>
                    </div>
                </div>

                <!-- Discovery Tab -->
                <div id="discovery" class="tab-content">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-slate-600 mb-1">Target Website URL</label>
                            <input type="text" id="url" placeholder="https://example.com" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-primary outline-none">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-slate-600 mb-1">Keywords (comma separated)</label>
                            <input type="text" id="keywords1" placeholder="CEO, Marketing, CTO" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-primary outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Crawler Type</label>
                            <select id="crawlerType" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-primary outline-none">
                                <option value="fast">Fast (HTTP/Soup)</option>
                                <option value="deep">Deep (Browser/JS)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-600 mb-1">Max Depth</label>
                                <input type="number" id="maxDepth" value="2" min="1" max="5" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-primary outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-600 mb-1">Max Pages</label>
                                <input type="number" id="maxPages" value="20" min="1" max="100" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-primary outline-none">
                            </div>
                        </div>
                    </div>
                    <button onclick="startDiscovery()" class="mt-6 w-full bg-primary hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-200">
                        Start Extraction
                    </button>
                </div>

                <!-- Bulk Tab -->
                <div id="bulk" class="tab-content hidden">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Upload Email List (CSV/TXT)</label>
                            <input type="file" id="file" accept=".txt,.csv" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-primary outline-none">
                            <p class="text-xs text-slate-500 mt-1">One email per line or comma-separated.</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Keywords</label>
                            <input type="text" id="keywords2" placeholder="CTO, Engineering" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-primary outline-none">
                        </div>
                    </div>
                    <button onclick="startBulk()" class="mt-6 w-full bg-primary hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-200">
                        Start Bulk Enrichment
                    </button>
                </div>

                <!-- History Tab -->
                <div id="history" class="tab-content hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full text-left text-sm whitespace-nowrap">
                            <thead class="uppercase tracking-wider border-b-2 border-slate-200 bg-slate-50">
                                <tr>
                                    <th class="px-6 py-4 text-slate-600">ID</th>
                                    <th class="px-6 py-4 text-slate-600">Target</th>
                                    <th class="px-6 py-4 text-slate-600">Date</th>
                                    <th class="px-6 py-4 text-slate-600">Leads</th>
                                    <th class="px-6 py-4 text-slate-600">Status</th>
                                    <th class="px-6 py-4 text-slate-600">Action</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody" class="divide-y divide-slate-100">
                                <!-- Populated via JS -->
                            </tbody>
                        </table>
                    </div>
                    <button onclick="loadHistory()" class="mt-4 text-primary hover:underline text-sm">Refresh History</button>
                </div>
            </div>
        </div>

        <!-- Processing / Results Section -->
        <div id="resultsSection" class="mt-8 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-slate-800">Results</h2>
                <div class="flex gap-2">
                    <button id="exportBtn" onclick="exportCSV()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow transition hidden">
                        <i class="fas fa-download mr-2"></i> Export CSV
                    </button>
                    <button id="stopBtn" onclick="stopProcess()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded shadow transition">
                        Stop
                    </button>
                </div>
            </div>

            <!-- Status Bar -->
            <div id="statusBar" class="bg-blue-50 text-blue-700 p-4 rounded mb-6 text-center italic border border-blue-100">
                Initializing...
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-4 rounded shadow text-center border-l-4 border-slate-400">
                    <div class="text-3xl font-bold text-slate-700" id="totalLeads">0</div>
                    <div class="text-sm text-slate-500">Total Leads</div>
                </div>
                <div class="bg-white p-4 rounded shadow text-center border-l-4 border-green-500">
                    <div class="text-3xl font-bold text-green-600" id="highQuality">0</div>
                    <div class="text-sm text-slate-500">High Quality</div>
                </div>
                <div class="bg-white p-4 rounded shadow text-center border-l-4 border-yellow-500">
                    <div class="text-3xl font-bold text-yellow-600" id="mediumQuality">0</div>
                    <div class="text-sm text-slate-500">Medium Quality</div>
                </div>
                <div class="bg-white p-4 rounded shadow text-center border-l-4 border-red-500">
                    <div class="text-3xl font-bold text-red-600" id="lowQuality">0</div>
                    <div class="text-sm text-slate-500">Low Quality</div>
                </div>
            </div>

            <!-- Leads List -->
            <div id="leadsList" class="space-y-4">
                <!-- Cards injected here -->
            </div>
        </div>
    </div>

    <script>
        let ws;
        let currentJobId = null;
        let stats = { total: 0, high: 0, medium: 0, low: 0 };

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tab).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-primary', 'border-primary', 'active');
                btn.classList.add('text-slate-600', 'border-transparent');
                if(btn.dataset.tab === tab) {
                    btn.classList.add('text-primary', 'border-primary', 'active');
                    btn.classList.remove('text-slate-600', 'border-transparent');
                }
            });

            if(tab === 'history') loadHistory();
        }

        function toggleKeyInput() {
            const provider = document.getElementById('aiProvider').value;
            const container = document.getElementById('apiKeyContainer');
            if(provider === 'ollama') {
                container.classList.add('opacity-50', 'pointer-events-none');
                document.getElementById('apiKey').value = '';
            } else {
                container.classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const jobs = await res.json();
                const tbody = document.getElementById('historyTableBody');
                tbody.innerHTML = jobs.map(job => `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-6 py-4">#${job.id}</td>
                        <td class="px-6 py-4 font-medium">${job.target_url}</td>
                        <td class="px-6 py-4">${new Date(job.start_time).toLocaleDateString()}</td>
                        <td class="px-6 py-4">${job.lead_count}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs rounded-full ${job.status === 'completed' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                ${job.status}
                            </span>
                        </td>
                        <td class="px-6 py-4">
                            <button onclick="viewJob(${job.id})" class="text-primary hover:underline mr-2">View</button>
                            <a href="/api/export/${job.id}" class="text-green-600 hover:underline">CSV</a>
                        </td>
                    </tr>
                `).join('');
            } catch(e) {
                console.error("Failed to load history", e);
            }
        }

        async function viewJob(jobId) {
            try {
                const res = await fetch(`/api/history/${jobId}`);
                if(!res.ok) return alert("Job not found");
                const data = await res.json();

                resetUI();
                currentJobId = jobId;
                document.getElementById('exportBtn').classList.remove('hidden');
                document.getElementById('stopBtn').classList.add('hidden');
                document.getElementById('statusBar').textContent = `Viewing historical job #${jobId}`;

                data.leads.forEach(addLeadToUI);
                document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
            } catch(e) {
                console.error(e);
            }
        }

        function resetUI() {
            document.getElementById('resultsSection').classList.remove('hidden');
            document.getElementById('leadsList').innerHTML = '';
            document.getElementById('stopBtn').classList.remove('hidden');
            document.getElementById('exportBtn').classList.add('hidden');
            stats = { total: 0, high: 0, medium: 0, low: 0 };
            updateStats();
        }

        function initWS() {
            if (ws && ws.readyState === WebSocket.OPEN) return Promise.resolve();

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/analyze`);

            return new Promise((resolve, reject) => {
                ws.onopen = resolve;
                ws.onerror = reject;
                ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'status') {
                        document.getElementById('statusBar').textContent = msg.message;
                        if(msg.job_id) currentJobId = msg.job_id;
                    } else if (msg.type === 'lead') {
                        addLeadToUI(msg.data);
                    } else if (msg.type === 'complete') {
                        document.getElementById('statusBar').textContent = msg.message;
                        document.getElementById('stopBtn').classList.add('hidden');
                        document.getElementById('exportBtn').classList.remove('hidden');
                    }
                };
            });
        }

        function addLeadToUI(lead) {
            stats.total++;
            if (lead.lead_quality === 'high') stats.high++;
            else if (lead.lead_quality === 'medium') stats.medium++;
            else if (lead.lead_quality === 'low') stats.low++;
            updateStats();

            const container = document.getElementById('leadsList');
            const el = document.createElement('div');

            let borderClass = 'border-l-4 border-slate-400';
            if(lead.lead_quality === 'high') borderClass = 'border-l-4 border-green-500';
            if(lead.lead_quality === 'medium') borderClass = 'border-l-4 border-yellow-500';
            if(lead.lead_quality === 'reject') borderClass = 'border-l-4 border-red-500 opacity-75';

            const matches = lead.keyword_matches.map(m =>
                `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-xs mr-1">${m.keyword}</span>`
            ).join('');

            el.className = `bg-white p-4 rounded shadow ${borderClass} animate-fade-in transition hover:shadow-md`;
            el.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <div class="text-lg font-bold text-primary">${lead.email}</div>
                        <div class="text-sm text-slate-600">${lead.person.full_name || 'Unknown Name'} • ${lead.person.job_title || 'Unknown Role'}</div>
                    </div>
                    <div class="flex flex-col items-end gap-1">
                        <span class="px-2 py-1 rounded text-xs font-bold bg-blue-100 text-blue-800">Score: ${lead.relevance_score}</span>
                        <span class="px-2 py-1 rounded text-xs ${lead.validation.mx_records_found ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${lead.validation.mx_records_found ? 'MX Valid' : 'MX Failed'}
                        </span>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm text-slate-500 mt-2">
                    <div><i class="fas fa-building mr-1"></i> ${lead.company.name || lead.company.domain}</div>
                    <div><i class="fas fa-link mr-1"></i> <a href="${lead.source.url}" target="_blank" class="hover:underline truncate block w-full">${lead.source.url}</a></div>
                </div>
                <div class="mt-2 pt-2 border-t border-slate-100">
                    <div class="text-xs text-slate-400 mb-1">Matches:</div>
                    <div class="flex flex-wrap gap-1">${matches || '<span class="italic text-slate-400">None</span>'}</div>
                </div>
            `;

            container.insertBefore(el, container.firstChild);
        }

        function updateStats() {
            document.getElementById('totalLeads').textContent = stats.total;
            document.getElementById('highQuality').textContent = stats.high;
            document.getElementById('mediumQuality').textContent = stats.medium;
            document.getElementById('lowQuality').textContent = stats.low;
        }

        async function startDiscovery() {
            await initWS();
            resetUI();

            const payload = {
                url: document.getElementById('url').value,
                keywords: document.getElementById('keywords1').value.split(',').map(k => k.trim()),
                max_depth: parseInt(document.getElementById('maxDepth').value),
                max_pages: parseInt(document.getElementById('maxPages').value),
                ai_provider: document.getElementById('aiProvider').value,
                api_key: document.getElementById('apiKey').value,
                crawler_type: document.getElementById('crawlerType').value
            };

            ws.send(JSON.stringify({ action: "start_crawl", payload }));
            document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
        }

        async function startBulk() {
            await initWS();
            const fileInput = document.getElementById('file');
            if(!fileInput.files.length) return alert("Select a file");

            const reader = new FileReader();
            reader.onload = (e) => {
                resetUI();
                const text = e.target.result;
                const emails = text.replace(/,/g, '\n').split('\n').map(e => e.trim()).filter(e => e.includes('@'));

                const payload = {
                    emails: emails,
                    keywords: document.getElementById('keywords2').value.split(',').map(k => k.trim()),
                    ai_provider: document.getElementById('aiProvider').value,
                    api_key: document.getElementById('apiKey').value
                };

                ws.send(JSON.stringify({ action: "start_bulk", payload }));
                document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
            };
            reader.readAsText(fileInput.files[0]);
        }

        function stopProcess() {
            if(ws) ws.send(JSON.stringify({ action: "stop" }));
        }

        function exportCSV() {
            if(!currentJobId) return;
            window.location.href = `/api/export/${currentJobId}`;
        }
    </script>
</body>
</html>
