<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Lead Extractor AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom Animations */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        .toast-enter {
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .toast-exit {
            animation: fadeOutRight 0.3s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        .tab-content {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .tab-content.hidden {
            display: none;
            opacity: 0;
            transform: translateY(10px);
        }

        .tab-content:not(.hidden) {
            display: block;
            animation: fadeInTab 0.4s ease forwards;
        }

        @keyframes fadeInTab {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .animate-card {
            animation: cardSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Smooth stat transitions */
        .stat-value {
            transition: color 0.3s ease;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#475569',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-primary mb-2">Intelligent Lead Extractor AI</h1>
            <p class="text-slate-500">Advanced Web Discovery & Enrichment System</p>
        </header>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <!-- Navigation Tabs -->
            <div class="flex border-b border-slate-200 bg-slate-50/50 backdrop-blur-sm sticky top-0 z-10">
                <button onclick="switchTab('discovery')" class="tab-btn flex-1 md:flex-none px-6 py-4 font-semibold text-slate-600 hover:text-primary hover:bg-white border-b-2 border-transparent hover:border-blue-300 transition-all duration-200 active" data-tab="discovery">
                    <i class="fas fa-search mr-2"></i> <span class="hidden sm:inline">Web Discovery</span>
                </button>
                <button onclick="switchTab('bulk')" class="tab-btn flex-1 md:flex-none px-6 py-4 font-semibold text-slate-600 hover:text-primary hover:bg-white border-b-2 border-transparent hover:border-blue-300 transition-all duration-200" data-tab="bulk">
                    <i class="fas fa-file-upload mr-2"></i> <span class="hidden sm:inline">Bulk Enrichment</span>
                </button>
                <button onclick="switchTab('history')" class="tab-btn flex-1 md:flex-none px-6 py-4 font-semibold text-slate-600 hover:text-primary hover:bg-white border-b-2 border-transparent hover:border-blue-300 transition-all duration-200" data-tab="history">
                    <i class="fas fa-history mr-2"></i> <span class="hidden sm:inline">History</span>
                </button>
            </div>

            <div class="p-6">
                <!-- AI Settings (Common) -->
                <div class="mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <h3 class="font-semibold text-slate-700 mb-3"><i class="fas fa-robot mr-2"></i>AI Configuration</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Provider</label>
                            <select id="aiProvider" onchange="toggleKeyInput()" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                                <option value="openai">OpenAI (GPT-3.5)</option>
                                <option value="gemini">Google Gemini</option>
                                <option value="anthropic">Anthropic (Claude)</option>
                                <option value="ollama">Ollama (Local)</option>
                            </select>
                        </div>
                        <div id="apiKeyContainer" class="transition-opacity duration-300">
                            <label class="block text-sm font-medium text-slate-600 mb-1">API Key</label>
                            <input type="password" id="apiKey" placeholder="sk-..." class="w-full p-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400">
                            <p class="text-xs text-slate-400 mt-1" id="keyHelp">Leave blank if set in environment variables.</p>
                        </div>
                    </div>
                </div>

                <!-- Discovery Tab -->
                <div id="discovery" class="tab-content">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Target Website URL</label>
                            <input type="text" id="url" placeholder="https://example.com" class="w-full p-3 bg-white border border-slate-300 rounded-lg focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all shadow-sm placeholder:text-slate-400">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Keywords (comma separated)</label>
                            <input type="text" id="keywords1" placeholder="CEO, Marketing, CTO" class="w-full p-3 bg-white border border-slate-300 rounded-lg focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all shadow-sm placeholder:text-slate-400">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Crawler Type</label>
                            <select id="crawlerType" class="w-full p-3 bg-white border border-slate-300 rounded-lg focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all shadow-sm">
                                <option value="fast">Fast (HTTP/Soup)</option>
                                <option value="deep">Deep (Browser/JS)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Max Depth</label>
                                <input type="number" id="maxDepth" value="2" min="1" max="5" class="w-full p-3 bg-white border border-slate-300 rounded-lg focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all shadow-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Max Pages</label>
                                <input type="number" id="maxPages" value="20" min="1" max="100" class="w-full p-3 bg-white border border-slate-300 rounded-lg focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all shadow-sm">
                            </div>
                        </div>
                    </div>
                    <button id="btnDiscovery" onclick="startDiscovery()" class="mt-8 w-full bg-primary hover:bg-blue-600 active:bg-blue-800 active:scale-[0.99] text-white font-bold py-3 px-4 rounded-lg shadow shadow-blue-500/30 transition-all duration-200 flex justify-center items-center gap-2 group">
                        <i class="fas fa-play group-hover:scale-110 transition-transform hidden"></i>
                        <span id="txtDiscovery">Start Extraction</span>
                        <i id="spinDiscovery" class="fas fa-spinner fa-spin hidden ml-2"></i>
                    </button>
                </div>

                <!-- Bulk Tab -->
                <div id="bulk" class="tab-content hidden">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Upload Email List (CSV/TXT)</label>
                            <div class="flex items-center justify-center w-full">
                                <label for="file" class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-300 border-dashed rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100 hover:border-primary transition-all group">
                                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                        <i class="fas fa-cloud-upload-alt text-3xl text-slate-400 group-hover:text-primary mb-2 transition-colors"></i>
                                        <p class="mb-1 text-sm text-slate-500"><span class="font-semibold text-primary">Click to upload</span> or drag and drop</p>
                                        <p class="text-xs text-slate-500">.txt or .csv files (one email per line/comma separated)</p>
                                        <p id="fileNameDisplay" class="text-sm font-semibold text-green-600 mt-2 hidden"></p>
                                    </div>
                                    <input id="file" type="file" accept=".txt,.csv" class="hidden" onchange="updateFileName(this)" />
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Keywords</label>
                            <input type="text" id="keywords2" placeholder="CTO, Engineering, Technology" class="w-full p-3 bg-white border border-slate-300 rounded-lg focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all shadow-sm placeholder:text-slate-400">
                        </div>
                    </div>
                    <button id="btnBulk" onclick="startBulk()" class="mt-8 w-full bg-primary hover:bg-blue-600 active:bg-blue-800 active:scale-[0.99] text-white font-bold py-3 px-4 rounded-lg shadow shadow-blue-500/30 transition-all duration-200 flex justify-center items-center gap-2 group">
                        <i class="fas fa-layer-group group-hover:scale-110 transition-transform hidden"></i>
                        <span id="txtBulk">Start Bulk Enrichment</span>
                        <i id="spinBulk" class="fas fa-spinner fa-spin hidden ml-2"></i>
                    </button>
                </div>

                <!-- History Tab -->
                <div id="history" class="tab-content hidden">
                    <div class="overflow-x-auto rounded-lg border border-slate-200">
                        <table class="min-w-full text-left text-sm whitespace-nowrap">
                            <thead class="uppercase tracking-wider border-b border-slate-200 bg-slate-50 text-xs font-semibold">
                                <tr>
                                    <th class="px-6 py-4 text-slate-500">ID</th>
                                    <th class="px-6 py-4 text-slate-500">Target</th>
                                    <th class="px-6 py-4 text-slate-500">Date</th>
                                    <th class="px-6 py-4 text-slate-500">Leads</th>
                                    <th class="px-6 py-4 text-slate-500">Status</th>
                                    <th class="px-6 py-4 text-slate-500">Action</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody" class="divide-y divide-slate-100 bg-white">
                                <!-- Populated via JS -->
                                <tr><td colspan="6" class="px-6 py-8 text-center text-slate-500 italic">Click Refresh to load history...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="flex justify-end mt-4">
                        <button onclick="loadHistory()" class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition-colors text-sm font-medium">
                            <i class="fas fa-sync-alt"></i> Refresh History
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Processing / Results Section -->
        <div id="resultsSection" class="mt-8 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-slate-800">Results</h2>
                <div class="flex gap-2">
                    <button id="exportBtn" onclick="exportCSV()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow transition hidden">
                        <i class="fas fa-download mr-2"></i> Export CSV
                    </button>
                    <button id="stopBtn" onclick="stopProcess()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded shadow transition">
                        Stop
                    </button>
                </div>
            </div>

            <!-- Status Bar -->
            <div id="statusBar" class="bg-blue-50 text-blue-700 p-4 rounded mb-6 text-center italic border border-blue-100">
                Initializing...
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-5 rounded-xl shadow-sm hover:shadow-md transition-shadow text-center border-t-4 border-slate-400 transform hover:-translate-y-1 transition-transform duration-200">
                    <div class="text-3xl font-bold text-slate-700 stat-value" id="totalLeads">0</div>
                    <div class="text-sm text-slate-500 mt-1 uppercase tracking-wider font-semibold">Total Leads</div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm hover:shadow-md transition-shadow text-center border-t-4 border-green-500 transform hover:-translate-y-1 transition-transform duration-200">
                    <div class="text-3xl font-bold text-green-600 stat-value" id="highQuality">0</div>
                    <div class="text-sm text-slate-500 mt-1 uppercase tracking-wider font-semibold">High Quality</div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm hover:shadow-md transition-shadow text-center border-t-4 border-yellow-500 transform hover:-translate-y-1 transition-transform duration-200">
                    <div class="text-3xl font-bold text-yellow-500 stat-value" id="mediumQuality">0</div>
                    <div class="text-sm text-slate-500 mt-1 uppercase tracking-wider font-semibold">Medium Quality</div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm hover:shadow-md transition-shadow text-center border-t-4 border-red-500 transform hover:-translate-y-1 transition-transform duration-200">
                    <div class="text-3xl font-bold text-red-500 stat-value" id="lowQuality">0</div>
                    <div class="text-sm text-slate-500 mt-1 uppercase tracking-wider font-semibold">Low Quality</div>
                </div>
            </div>

            <!-- Leads List -->
            <div id="leadsList" class="space-y-4 pb-12">
                <!-- Cards injected here -->
            </div>
        </div>
    </div>

    <script>
        let ws;
        let currentJobId = null;
        let stats = { total: 0, high: 0, medium: 0, low: 0 };

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            const icons = {
                success: '<i class="fas fa-check-circle text-green-500"></i>',
                error: '<i class="fas fa-exclamation-circle text-red-500"></i>',
                info: '<i class="fas fa-info-circle text-blue-500"></i>'
            };

            const borders = {
                success: 'border-green-500',
                error: 'border-red-500',
                info: 'border-blue-500'
            };

            toast.className = `flex items-center p-4 bg-white border-l-4 ${borders[type]} rounded shadow-lg toast-enter pointer-events-auto transition-transform`;
            toast.innerHTML = `
                <div class="mr-3 text-xl">${icons[type]}</div>
                <div class="text-sm font-medium text-slate-700">${message}</div>
                <button onclick="this.parentElement.remove()" class="ml-4 text-slate-400 hover:text-slate-600 focus:outline-none">
                    <i class="fas fa-times"></i>
                </button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                toast.addEventListener('animationend', () => toast.remove());
            }, 4000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tab).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-primary', 'border-primary', 'bg-white', 'active');
                btn.classList.add('text-slate-600', 'border-transparent');
                if(btn.dataset.tab === tab) {
                    btn.classList.add('text-primary', 'border-primary', 'bg-white', 'active');
                    btn.classList.remove('text-slate-600', 'border-transparent');
                }
            });

            if(tab === 'history') loadHistory();
        }

        function toggleKeyInput() {
            const provider = document.getElementById('aiProvider').value;
            const container = document.getElementById('apiKeyContainer');
            if(provider === 'ollama') {
                container.classList.add('opacity-50', 'pointer-events-none');
                document.getElementById('apiKey').value = '';
            } else {
                container.classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        async function loadHistory() {
            try {
                const tbody = document.getElementById('historyTableBody');
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Loading history...</td></tr>';

                const res = await fetch('/api/history');
                const jobs = await res.json();

                if (jobs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-slate-500 italic">No extraction history found.</td></tr>';
                    return;
                }

                tbody.innerHTML = jobs.map(job => `
                    <tr class="hover:bg-blue-50/50 transition-colors group">
                        <td class="px-6 py-4 text-slate-500 font-medium">#${job.id}</td>
                        <td class="px-6 py-4 font-semibold text-slate-700">
                            <div class="flex items-center gap-2">
                                <i class="fas ${job.crawler_type === 'bulk' ? 'fa-file-alt text-purple-400' : 'fa-globe text-blue-400'} w-4"></i>
                                ${job.target_url}
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-500">${new Date(job.start_time).toLocaleDateString()} <span class="text-xs text-slate-400 ml-1">${new Date(job.start_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></td>
                        <td class="px-6 py-4">
                            <span class="bg-slate-100 text-slate-700 px-2 py-1 rounded font-medium text-xs border border-slate-200">${job.lead_count}</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-1 text-[10px] uppercase font-bold tracking-wider rounded-full ${job.status === 'completed' ? 'bg-green-100 text-green-700 border border-green-200' : (job.status === 'stopped' ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-yellow-100 text-yellow-700 border border-yellow-200')}">
                                ${job.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="viewJob(${job.id})" class="text-primary hover:text-blue-800 transition-colors mr-3 font-medium text-sm border border-transparent hover:border-blue-200 hover:bg-blue-50 px-2 py-1 rounded opacity-0 group-hover:opacity-100 focus:opacity-100">View</button>
                            <a href="/api/export/${job.id}" class="text-green-600 hover:text-green-800 transition-colors font-medium text-sm border border-transparent hover:border-green-200 hover:bg-green-50 px-2 py-1 rounded opacity-0 group-hover:opacity-100 focus:opacity-100">CSV</a>
                        </td>
                    </tr>
                `).join('');
            } catch(e) {
                console.error("Failed to load history", e);
                showToast("Failed to load history", "error");
                document.getElementById('historyTableBody').innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-red-500">Failed to load history.</td></tr>';
            }
        }

        async function viewJob(jobId) {
            try {
                const res = await fetch(`/api/history/${jobId}`);
                if(!res.ok) {
                    showToast("Job not found", "error");
                    return;
                }
                const data = await res.json();

                resetUI();
                currentJobId = jobId;
                document.getElementById('exportBtn').classList.remove('hidden');
                document.getElementById('stopBtn').classList.add('hidden');
                document.getElementById('statusBar').textContent = `Viewing historical job #${jobId}`;

                data.leads.forEach(addLeadToUI);
                document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
            } catch(e) {
                console.error(e);
                showToast("Failed to load job details", "error");
            }
        }

        function resetUI() {
            document.getElementById('resultsSection').classList.remove('hidden');
            document.getElementById('leadsList').innerHTML = '';
            document.getElementById('stopBtn').classList.remove('hidden');
            document.getElementById('exportBtn').classList.add('hidden');
            stats = { total: 0, high: 0, medium: 0, low: 0 };
            updateStats();
        }

        function initWS() {
            if (ws && ws.readyState === WebSocket.OPEN) return Promise.resolve();

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/analyze`);

            return new Promise((resolve, reject) => {
                ws.onopen = resolve;
                ws.onerror = reject;
                ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'status') {
                        document.getElementById('statusBar').textContent = msg.message;
                        if(msg.job_id) currentJobId = msg.job_id;
                    } else if (msg.type === 'lead') {
                        addLeadToUI(msg.data);
                    } else if (msg.type === 'complete') {
                        document.getElementById('statusBar').textContent = msg.message;
                        document.getElementById('stopBtn').classList.add('hidden');
                        document.getElementById('exportBtn').classList.remove('hidden');
                    }
                };
            });
        }

        function addLeadToUI(lead) {
            stats.total++;
            if (lead.lead_quality === 'high') stats.high++;
            else if (lead.lead_quality === 'medium') stats.medium++;
            else if (lead.lead_quality === 'low') stats.low++;
            updateStats();

            const container = document.getElementById('leadsList');
            const el = document.createElement('div');

            let borderClass = 'border-l-4 border-slate-400';
            if(lead.lead_quality === 'high') borderClass = 'border-l-4 border-green-500';
            if(lead.lead_quality === 'medium') borderClass = 'border-l-4 border-yellow-500';
            if(lead.lead_quality === 'reject') borderClass = 'border-l-4 border-red-500 opacity-75';

            const matches = lead.keyword_matches.map(m =>
                `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-xs mr-1 border border-slate-200">${m.keyword}</span>`
            ).join('');

            el.className = `bg-white p-5 rounded-xl shadow-sm ${borderClass} animate-card hover:shadow-md transition-all duration-300`;
            el.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <div class="text-lg font-bold text-primary flex items-center gap-2">
                            ${lead.email}
                            <button onclick="navigator.clipboard.writeText('${lead.email}'); showToast('Email copied', 'success')" class="text-slate-300 hover:text-primary transition-colors text-sm" title="Copy to clipboard">
                                <i class="far fa-copy"></i>
                            </button>
                        </div>
                        <div class="text-sm font-medium text-slate-600 mt-1">${lead.person.full_name || 'Unknown Name'} • <span class="text-slate-500 font-normal">${lead.person.job_title || 'Unknown Role'}</span></div>
                    </div>
                    <div class="flex flex-col items-end gap-2">
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200 shadow-sm flex items-center gap-1">
                            <i class="fas fa-star text-yellow-400 text-[10px]"></i> Score: ${lead.relevance_score}
                        </span>
                        <span class="px-3 py-1 rounded-full text-xs font-medium border shadow-sm flex items-center gap-1 ${lead.validation.mx_records_found ? 'bg-green-50 text-green-700 border-green-200' : 'bg-red-50 text-red-700 border-red-200'}">
                            <i class="fas ${lead.validation.mx_records_found ? 'fa-check-circle' : 'fa-times-circle'} text-[10px]"></i>
                            ${lead.validation.mx_records_found ? 'MX Valid' : 'MX Failed'}
                        </span>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm text-slate-600 mt-4 bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <div class="flex items-center gap-2"><i class="fas fa-building text-slate-400 w-4"></i> <span class="truncate">${lead.company.name || lead.company.domain}</span></div>
                    <div class="flex items-center gap-2"><i class="fas fa-link text-slate-400 w-4"></i> <a href="${lead.source.url}" target="_blank" class="text-blue-600 hover:underline truncate block w-full">${lead.source.url}</a></div>
                </div>
                <div class="mt-4 flex flex-wrap gap-1 items-center">
                    <span class="text-xs text-slate-400 font-medium mr-2 uppercase tracking-wider">Matches:</span>
                    ${matches || '<span class="italic text-slate-400 text-xs">None</span>'}
                </div>
            `;

            container.insertBefore(el, container.firstChild);
        }

        function updateStats() {
            document.getElementById('totalLeads').textContent = stats.total;
            document.getElementById('highQuality').textContent = stats.high;
            document.getElementById('mediumQuality').textContent = stats.medium;
            document.getElementById('lowQuality').textContent = stats.low;
        }

        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            if (input.files && input.files[0]) {
                display.textContent = `Selected: ${input.files[0].name}`;
                display.classList.remove('hidden');
            } else {
                display.classList.add('hidden');
            }
        }

        function toggleLoading(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            const spin = document.getElementById(btnId.replace('btn', 'spin'));
            const txt = document.getElementById(btnId.replace('btn', 'txt'));

            if (isLoading) {
                btn.classList.add('opacity-75', 'cursor-not-allowed');
                btn.disabled = true;
                spin.classList.remove('hidden');
                txt.textContent = 'Processing...';
            } else {
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                btn.disabled = false;
                spin.classList.add('hidden');
                txt.textContent = btnId === 'btnDiscovery' ? 'Start Extraction' : 'Start Bulk Enrichment';
            }
        }

        async function startDiscovery() {
            await initWS();
            resetUI();

            const payload = {
                url: document.getElementById('url').value,
                keywords: document.getElementById('keywords1').value.split(',').map(k => k.trim()),
                max_depth: parseInt(document.getElementById('maxDepth').value),
                max_pages: parseInt(document.getElementById('maxPages').value),
                ai_provider: document.getElementById('aiProvider').value,
                api_key: document.getElementById('apiKey').value,
                crawler_type: document.getElementById('crawlerType').value
            };

            toggleLoading('btnDiscovery', true);
            ws.send(JSON.stringify({ action: "start_crawl", payload }));
            document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });

            // Re-enable button on complete/stop
            const originalOnMessage = ws.onmessage;
            ws.onmessage = (event) => {
                if (originalOnMessage) originalOnMessage(event);
                const msg = JSON.parse(event.data);
                if (msg.type === 'complete' || msg.type === 'error' || msg.message === 'Process stopped by user.') {
                    toggleLoading('btnDiscovery', false);
                }
            };
        }

        async function startBulk() {
            await initWS();
            const fileInput = document.getElementById('file');
            if(!fileInput.files.length) {
                showToast("Please select a file to upload.", "error");
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                resetUI();
                const text = e.target.result;

                const payload = {
                    emails: [text], // Sending raw text in array to keep signature compat
                    keywords: document.getElementById('keywords2').value.split(',').map(k => k.trim()),
                    ai_provider: document.getElementById('aiProvider').value,
                    api_key: document.getElementById('apiKey').value
                };

                toggleLoading('btnBulk', true);
                ws.send(JSON.stringify({ action: "start_bulk", payload }));
                document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });

                const originalOnMessage = ws.onmessage;
                ws.onmessage = (event) => {
                    if (originalOnMessage) originalOnMessage(event);
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'complete' || msg.type === 'error' || msg.message === 'Process stopped by user.') {
                        toggleLoading('btnBulk', false);
                    }
                };
            };
            reader.readAsText(fileInput.files[0]);
        }

        function stopProcess() {
            if(ws) ws.send(JSON.stringify({ action: "stop" }));
        }

        function exportCSV() {
            if(!currentJobId) return;
            window.location.href = `/api/export/${currentJobId}`;
        }
    </script>
</body>
</html>
