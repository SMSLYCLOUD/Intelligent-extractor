<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Lead Extractor AI</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #475569;
            --success: #16a34a;
            --warning: #ca8a04;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: #1e293b;
            line-height: 1.5;
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .card {
            background: var(--card);
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .tabs {
            display: flex;
            margin-bottom: 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-weight: 600;
            color: var(--secondary);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        input[type="text"], input[type="number"], input[type="password"], select, input[type="file"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.25rem;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button.stop-btn {
            background-color: var(--danger);
            margin-top: 1rem;
        }

        button.stop-btn:hover {
             background-color: #b91c1c;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .hidden { display: none; }

        /* Results Styles */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: white;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .summary-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .lead-card {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            background: white;
            border-left: 4px solid var(--secondary);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lead-card.high { border-left-color: var(--success); }
        .lead-card.medium { border-left-color: var(--warning); }
        .lead-card.low { border-left-color: var(--secondary); }
        .lead-card.reject { border-left-color: var(--danger); opacity: 0.7; }

        .lead-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .email {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--primary);
        }

        .badges {
            display: flex;
            gap: 0.5rem;
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-score { background: #e0f2fe; color: #0369a1; }
        .badge-valid { background: #dcfce7; color: #15803d; }
        .badge-invalid { background: #fee2e2; color: #b91c1c; }

        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            font-size: 0.875rem;
            color: #475569;
        }

        #statusMessage {
            text-align: center;
            color: var(--secondary);
            font-style: italic;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Intelligent Lead Extractor AI</h1>
            <p>Live Web Discovery & Bulk Enrichment</p>
        </div>

        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('discovery')">Web Discovery</div>
                <div class="tab" onclick="switchTab('bulk')">Bulk Enrichment</div>
            </div>

            <!-- AI Settings Common -->
            <div class="form-group" style="background: #f1f5f9; padding: 1rem; border-radius: 0.5rem;">
                <label>AI Intelligence Provider</label>
                <select id="aiProvider" onchange="toggleKeyInput()">
                    <option value="openai">OpenAI (GPT-3.5)</option>
                    <option value="gemini">Google Gemini (Flash)</option>
                </select>
                <div id="openaiInput" class="form-group" style="margin-top: 10px;">
                    <label for="openaiKey">OpenAI API Key</label>
                    <input type="password" id="openaiKey" placeholder="sk-...">
                </div>
                <div id="geminiInput" class="form-group hidden" style="margin-top: 10px;">
                    <label for="geminiKey">Gemini API Key</label>
                    <input type="password" id="geminiKey" placeholder="AIza...">
                </div>
            </div>

            <!-- Discovery Form -->
            <div id="discoveryForm">
                <div class="form-group">
                    <label for="url">Target Website URL</label>
                    <input type="text" id="url" name="url" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="keywords1">Keywords (comma separated)</label>
                    <input type="text" id="keywords1" name="keywords" placeholder="CEO, Marketing, CTO" required>
                </div>
                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label for="maxDepth">Max Depth</label>
                        <input type="number" id="maxDepth" name="maxDepth" value="2" min="1" max="5">
                    </div>
                    <div>
                        <label for="maxPages">Max Pages</label>
                        <input type="number" id="maxPages" name="maxPages" value="20" min="1" max="100">
                    </div>
                </div>
                <button onclick="startDiscovery()">Start Extraction</button>
            </div>

            <!-- Bulk Form -->
            <div id="bulkForm" class="hidden">
                <div class="form-group">
                    <label for="file">Upload Email List (CSV or TXT)</label>
                    <input type="file" id="file" name="file" accept=".txt,.csv" required>
                    <small>One email per line or comma-separated</small>
                </div>
                <div class="form-group">
                    <label for="keywords2">Keywords (comma separated)</label>
                    <input type="text" id="keywords2" name="keywords" placeholder="CEO, Marketing, CTO" required>
                </div>
                <button onclick="startBulk()">Start Bulk Enrichment</button>
            </div>

            <button id="stopBtn" class="stop-btn hidden" onclick="stopProcess()">Stop Processing</button>
        </div>

        <div id="results" class="hidden">
            <div id="statusMessage">Waiting for data...</div>

            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-number" id="totalLeads">0</div>
                    <div>Total Leads</div>
                </div>
                <div class="summary-card">
                    <div class="summary-number" id="highQuality" style="color: var(--success)">0</div>
                    <div>High Quality</div>
                </div>
                <div class="summary-card">
                    <div class="summary-number" id="mediumQuality" style="color: var(--warning)">0</div>
                    <div>Medium Quality</div>
                </div>
            </div>
            <div id="leadsList"></div>
        </div>
    </div>

    <script>
        let ws;
        let stats = { total: 0, high: 0, medium: 0, low: 0 };

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');

            if (tab === 'discovery') {
                document.getElementById('discoveryForm').classList.remove('hidden');
                document.getElementById('bulkForm').classList.add('hidden');
            } else {
                document.getElementById('discoveryForm').classList.add('hidden');
                document.getElementById('bulkForm').classList.remove('hidden');
            }
        }

        function toggleKeyInput() {
            const provider = document.getElementById('aiProvider').value;
            if (provider === 'openai') {
                document.getElementById('openaiInput').classList.remove('hidden');
                document.getElementById('geminiInput').classList.add('hidden');
            } else {
                document.getElementById('openaiInput').classList.add('hidden');
                document.getElementById('geminiInput').classList.remove('hidden');
            }
        }

        function getKey() {
            const provider = document.getElementById('aiProvider').value;
            return provider === 'openai'
                ? document.getElementById('openaiKey').value
                : document.getElementById('geminiKey').value;
        }

        function initWS() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/analyze`);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'status') {
                    document.getElementById('statusMessage').textContent = msg.message;
                } else if (msg.type === 'lead') {
                    addLead(msg.data);
                } else if (msg.type === 'complete') {
                    document.getElementById('statusMessage').textContent = msg.message;
                    document.getElementById('stopBtn').classList.add('hidden');
                }
            };

            ws.onclose = () => {
                console.log("WebSocket disconnected");
                document.getElementById('stopBtn').classList.add('hidden');
            };
        }

        function resetUI() {
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('leadsList').innerHTML = '';
            document.getElementById('stopBtn').classList.remove('hidden');
            stats = { total: 0, high: 0, medium: 0, low: 0 };
            updateStats();
        }

        async function startDiscovery() {
            initWS();
            // Wait for connection
            while (ws.readyState !== WebSocket.OPEN) {
                await new Promise(r => setTimeout(r, 100));
            }

            resetUI();

            const payload = {
                url: document.getElementById('url').value,
                keywords: document.getElementById('keywords1').value.split(',').map(k => k.trim()),
                max_depth: parseInt(document.getElementById('maxDepth').value),
                max_pages: parseInt(document.getElementById('maxPages').value),
                ai_provider: document.getElementById('aiProvider').value,
                api_key: getKey()
            };

            ws.send(JSON.stringify({ action: "start_crawl", payload }));
        }

        async function startBulk() {
            initWS();
            while (ws.readyState !== WebSocket.OPEN) {
                await new Promise(r => setTimeout(r, 100));
            }

            const fileInput = document.getElementById('file');
            if (!fileInput.files.length) return alert("Please select a file");

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async (e) => {
                const text = e.target.result;
                const emails = text.replace(/,/g, '\n').split('\n').map(e => e.trim()).filter(e => e.includes('@'));

                resetUI();

                const payload = {
                    emails: emails,
                    keywords: document.getElementById('keywords2').value.split(',').map(k => k.trim()),
                    ai_provider: document.getElementById('aiProvider').value,
                    api_key: getKey()
                };

                ws.send(JSON.stringify({ action: "start_bulk", payload }));
            };

            reader.readAsText(file);
        }

        function stopProcess() {
            if (ws) ws.send(JSON.stringify({ action: "stop" }));
            document.getElementById('stopBtn').classList.add('hidden');
            document.getElementById('statusMessage').textContent = "Stopping...";
        }

        function addLead(lead) {
            // Update stats
            stats.total++;
            if (lead.lead_quality === 'high') stats.high++;
            else if (lead.lead_quality === 'medium') stats.medium++;
            else if (lead.lead_quality === 'low') stats.low++;
            updateStats();

            const list = document.getElementById('leadsList');
            const card = document.createElement('div');
            card.className = `lead-card ${lead.lead_quality}`;

            const matches = lead.keyword_matches.map(m =>
                `<span style="background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.75em;">${m.keyword}</span>`
            ).join(' ');

            card.innerHTML = `
                <div class="lead-header">
                    <div class="email">${lead.email}</div>
                    <div class="badges">
                        <span class="badge badge-score">Score: ${lead.relevance_score}</span>
                        <span class="badge ${lead.validation.mx_records_found ? 'badge-valid' : 'badge-invalid'}">
                            ${lead.validation.mx_records_found ? 'MX Valid' : 'MX Failed'}
                        </span>
                    </div>
                </div>
                <div class="details">
                    <div><strong>Role:</strong> ${lead.person.job_title || 'Unknown'}</div>
                    <div><strong>Company:</strong> ${lead.company.name || lead.company.domain}</div>
                    <div><strong>Matches:</strong> ${matches || 'None'}</div>
                    <div><strong>Found via:</strong> ${lead.source.discovery_method}</div>
                </div>
            `;

            // Prepend to show newest first
            list.insertBefore(card, list.firstChild);
        }

        function updateStats() {
            document.getElementById('totalLeads').textContent = stats.total;
            document.getElementById('highQuality').textContent = stats.high;
            document.getElementById('mediumQuality').textContent = stats.medium;
        }
    </script>
</body>
</html>
